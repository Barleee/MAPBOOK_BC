name: build_and_push

on:
  push:
  - env-test
  - env=qa

permissions:
  contents : read
  packages: write

jobs:
  build-and-deploy:
    name: build & deploy
    runs-on:
      - self-hosted

    environment: ${{ github.ref_name }}

    steps:
    - uses: actions/checkout@v3

    - name: building and setting docker enviroment on serwer

    run:
      docker-compose -f ./docker-compose/docker-compose.yml -p mapbook_bc up --build -d
